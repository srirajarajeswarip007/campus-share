<div class="admin-settings-view">
  <div style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-dark);">Admin System Settings</h2>
    <p style="font-size: 0.88rem; color: var(--text-muted);">Configure default borrowing durations, fine penalties, and global notifications.</p>
  </div>

  <div class="card" style="max-width: 800px;">
    <form ng-submit="saveSettings()">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
        <div class="form-group">
          <label>Default Borrow Duration (Days)</label>
          <input type="number" class="form-control" ng-model="systemSettings.defaultBorrowDurationDays" min="1" max="30" required>
        </div>

        <div class="form-group">
          <label>Overdue Fine Rate ($ Per Day)</label>
          <input type="number" class="form-control" ng-model="systemSettings.finePerDay" min="0" max="100" required>
        </div>
      </div>

      <div class="form-group">
        <label>System Broadcast Banner Message</label>
        <textarea class="form-control" ng-model="systemSettings.broadcastMessage" rows="3" placeholder="Global message displayed to all students..."></textarea>
      </div>

      <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
        <label class="checkbox-label">
          <input type="checkbox" ng-model="systemSettings.allowStudentUploads">
          <span>Allow students to list their own personal resources for sharing</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" ng-model="systemSettings.requireApproval">
          <span>Require owner approval for all borrow requests</span>
        </label>
      </div>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end;">
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Save System Settings
        </button>
      </div>
    </form>
  </div>
</div>
